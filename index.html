<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Gem Rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f172a; font-family: system-ui, sans-serif; color: #fff; }
  #stage { position: fixed; inset: 0; }
  #hud { position: fixed; top: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 16px; pointer-events: none; font-weight: 700; }
  #hud span { background: rgba(15,23,42,.75); padding: 6px 14px; border-radius: 999px; }
  .panel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(15,23,42,.8); text-align: center; padding: 16px; }
  .panel[hidden] { display: none; }
  h1 { margin: 0; font-size: 40px; color: #22d3ee; }
  button, .btn { background: #6366f1; color: #fff; border: 0; border-radius: 10px; padding: 12px 28px; font-size: 18px; font-weight: 700; cursor: pointer; text-decoration: none; }
  .btn.alt, button.alt { background: #334155; }
  ol { list-style: none; padding: 0; margin: 6px 0 0; min-width: 240px; max-width: 90vw; }
  li { padding: 4px 10px; border-radius: 6px; text-align: left; }
  li.me { background: #22d3ee; color: #0f172a; font-weight: 700; }
  p { margin: 0; max-width: 420px; }
  .small { opacity: .75; font-size: 14px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"><span>Gems: <b id="gems">0</b></span><span>Time: <b id="time">45</b></span></div>

<div id="menu" class="panel">
  <h1>Gem Rush</h1>
  <p>Run around and grab as many gems as you can in 45 seconds.</p>
  <p class="small">Move: WASD / arrow keys, or drag on touch screens.</p>
  <p id="playerLine" class="small">Connecting to start.ng...</p>
  <a id="signin" class="btn alt" href="#" hidden>Sign in with start.ng</a>
  <button id="playBtn">Play</button>
  <b>Top players</b>
  <ol id="boardMenu"></ol>
</div>

<div id="over" class="panel" hidden>
  <h1>Time's up!</h1>
  <p>You collected <b id="finalGems">0</b> gems.</p>
  <p id="saveMsg" class="small"></p>
  <ol id="boardOver"></ol>
  <button id="againBtn">Play again</button>
  <button id="menuBtn" class="alt">Menu</button>
</div>

<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module" src="./game.js"></script>
</body>
</html>
